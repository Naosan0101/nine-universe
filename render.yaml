# Render Blueprint: Web + PostgreSQL
# https://render.com/docs/infrastructure-as-code
#
# 使い方:
# 1. このリポジトリを GitHub に push する
# 2. https://dashboard.render.com → New → Blueprint でこのリポジトリを接続する
# 3. Apply 後、左サイドバーのサービス名「nine-universe」をクリックする
# 4. ページ上部に公開 URL がある（例: https://nine-universe.onrender.com）
# 5. その URL を開けばログイン／新規登録して遊べる
#
# Tetris Golden のような Static Site ではなく、Spring Boot + PostgreSQL の Web Service。
# 無料プランは 15 分アイドルでスリープ（次のアクセスは約 1 分待つ）し、
# 無料 Postgres は作成から 30 日で期限切れになる。

services:
  - type: web
    name: nine-universe
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      - key: APP_REMEMBER_ME_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nine-universe-db
          property: connectionString

databases:
  - name: nine-universe-db
    plan: free
